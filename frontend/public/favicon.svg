<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Crescent & Star on Top -->
  <g transform="translate(32, 11)" filter="url(#glow)">
    <!-- Star -->
    <polygon points="0,-4 1.2,-1 4,-1 1.8,0.8 2.6,3.5 0,1.8 -2.6,3.5 -1.8,0.8 -4,-1 -1.2,-1" fill="#FEF3C7" transform="scale(0.8) translate(0, -1)"/>
    <!-- Crescent -->
    <path d="M-4,1 A4,4 0 1,0 4,1 A3.2,3.2 0 1,1 -4,1 Z" fill="url(#goldLight)" transform="rotate(-30)"/>
  </g>

  <!-- Mosque Dome -->
  <path d="M32,15 C33,18 44,22 44,33 C44,35 43,36 41,36 L23,36 C21,36 20,35 20,33 C20,22 31,18 32,15 Z" fill="url(#goldGrad)" opacity="0.95"/>
  <!-- Dome details/arch -->
  <path d="M32,18 C32.7,20.5 40,24 40,33 L24,33 C24,24 31.3,20.5 32,18 Z" fill="#047857" opacity="0.4"/>

  <!-- Small Dome Arch Window -->
  <path d="M29,36 L29,28 C29,26.5 35,26.5 35,28 L35,36 Z" fill="#064E3B"/>
  <path d="M30,36 L30,29 C30,28 34,28 34,29 L34,36 Z" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Open Quran / Book at Bottom -->
  <g transform="translate(0, 3)">
    <!-- Book Stand / Rehal Base -->
    <path d="M23,50 L32,45 L41,50 L43,48 L32,42 L21,48 Z" fill="url(#goldGrad)" opacity="0.85"/>
    
    <!-- Left Page -->
    <path d="M32,43 C26,38 18,39 14,41 C13.5,41.2 13,41.7 13,42.3 L13,48 C18,46 26,45 32,49 Z" fill="url(#bookGrad)"/>
    <!-- Right Page -->
    <path d="M32,43 C38,38 46,39 50,41 C50.5,41.2 51,41.7 51,42.3 L51,48 C46,46 38,45 32,49 Z" fill="url(#bookGrad)"/>

    <!-- Page spine line -->
    <line x1="32" y1="42.5" x2="32" y2="49.5" stroke="#94A3B8" stroke-width="1"/>
    
    <!-- Page text lines (left) -->
    <line x1="17" y1="43.5" x2="28" y2="42" stroke="#10B981" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
    <line x1="17" y1="45.5" x2="27" y2="44.2" stroke="#10B981" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    <!-- Page text lines (right) -->
    <line x1="36" y1="42" x2="47" y2="43.5" stroke="#10B981" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
    <line x1="37" y1="44.2" x2="47" y2="45.5" stroke="#10B981" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Sparkle details -->
  <circle cx="12" cy="18" r="1" fill="#FDE68A" opacity="0.7"/>
  <circle cx="52" cy="18" r="1" fill="#FDE68A" opacity="0.7"/>
</svg>