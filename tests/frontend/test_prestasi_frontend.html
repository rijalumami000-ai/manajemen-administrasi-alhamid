<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Prestasi Frontend</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
    }
    .test-section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .success { color: green; }
    .error { color: red; }
    button {
      padding: 8px 16px;
      margin: 5px;
      cursor: pointer;
    }
    #results {
      margin-top: 20px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <h1>Test Prestasi Frontend Functions</h1>
  
  <div class="test-section">
    <h2>Test 1: Load Prestasi Data</h2>
    <button onclick="testLoadPrestasi()">Test loadPrestasi()</button>
    <div id="load-result"></div>
  </div>

  <div class="test-section">
    <h2>Test 2: Create New Prestasi</h2>
    <button onclick="testCreatePrestasi()">Test Create Prestasi</button>
    <div id="create-result"></div>
  </div>

  <div class="test-section">
    <h2>Test 3: Update Prestasi</h2>
    <input type="number" id="update-id" placeholder="Prestasi ID">
    <button onclick="testUpdatePrestasi()">Test Update Prestasi</button>
    <div id="update-result"></div>
  </div>

  <div class="test-section">
    <h2>Test 4: Delete Prestasi</h2>
    <input type="number" id="delete-id" placeholder="Prestasi ID">
    <button onclick="testDeletePrestasi()">Test Delete Prestasi</button>
    <div id="delete-result"></div>
  </div>

  <div id="results">
    <h3>Test Results:</h3>
    <pre id="output"></pre>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000';
    
    function log(message, isError = false) {
      const output = document.getElementById('output');
      const timestamp = new Date().toLocaleTimeString();
      const className = isError ? 'error' : 'success';
      output.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
    }

    async function testLoadPrestasi() {
      const resultDiv = document.getElementById('load-result');
      try {
        const response = await fetch(`${API_BASE}/api/prestasi`);
        const data = await response.json();
        
        resultDiv.innerHTML = `<p class="success">✓ Loaded ${data.length} prestasi records</p>`;
        log(`✓ loadPrestasi: Found ${data.length} records`);
        
        if (data.length > 0) {
          resultDiv.innerHTML += `<pre>${JSON.stringify(data[0], null, 2)}</pre>`;
        }
      } catch (error) {
        resultDiv.innerHTML = `<p class="error">✗ Error: ${error.message}</p>`;
        log(`✗ loadPrestasi failed: ${error.message}`, true);
      }
    }

    async function testCreatePrestasi() {
      const resultDiv = document.getElementById('create-result');
      try {
        // First, get a santri ID
        const santriResponse = await fetch(`${API_BASE}/api/santri`);
        const santriList = await santriResponse.json();
        
        if (santriList.length === 0) {
          resultDiv.innerHTML = `<p class="error">✗ No santri found. Please add santri first.</p>`;
          log('✗ Cannot test create: No santri available', true);
          return;
        }

        const testData = {
          santri_id: santriList[0].id,
          jenis: 'Test Prestasi - Juara Lomba',
          tanggal: '2024-01-15',
          deskripsi: 'Test deskripsi prestasi',
          penghargaan: 'Medali Emas'
        };

        const response = await fetch(`${API_BASE}/api/prestasi`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(testData)
        });

        const result = await response.json();
        
        if (response.ok) {
          resultDiv.innerHTML = `<p class="success">✓ Created prestasi with ID: ${result.id}</p>`;
          resultDiv.innerHTML += `<pre>${JSON.stringify(result, null, 2)}</pre>`;
          log(`✓ savePrestasi (create): Success, ID=${result.id}`);
        } else {
          resultDiv.innerHTML = `<p class="error">✗ Error: ${result.error}</p>`;
          log(`✗ savePrestasi (create) failed: ${result.error}`, true);
        }
      } catch (error) {
        resultDiv.innerHTML = `<p class="error">✗ Error: ${error.message}</p>`;
        log(`✗ savePrestasi (create) failed: ${error.message}`, true);
      }
    }

    async function testUpdatePrestasi() {
      const resultDiv = document.getElementById('update-result');
      const id = document.getElementById('update-id').value;
      
      if (!id) {
        resultDiv.innerHTML = `<p class="error">✗ Please enter a prestasi ID</p>`;
        return;
      }

      try {
        const updateData = {
          santri_id: 1,
          jenis: 'Updated Test Prestasi',
          tanggal: '2024-01-20',
          deskripsi: 'Updated deskripsi',
          penghargaan: 'Updated Penghargaan'
        };

        const response = await fetch(`${API_BASE}/api/prestasi/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updateData)
        });

        const result = await response.json();
        
        if (response.ok) {
          resultDiv.innerHTML = `<p class="success">✓ Updated prestasi ID: ${id}</p>`;
          resultDiv.innerHTML += `<pre>${JSON.stringify(result, null, 2)}</pre>`;
          log(`✓ savePrestasi (update): Success, ID=${id}`);
        } else {
          resultDiv.innerHTML = `<p class="error">✗ Error: ${result.error}</p>`;
          log(`✗ savePrestasi (update) failed: ${result.error}`, true);
        }
      } catch (error) {
        resultDiv.innerHTML = `<p class="error">✗ Error: ${error.message}</p>`;
        log(`✗ savePrestasi (update) failed: ${error.message}`, true);
      }
    }

    async function testDeletePrestasi() {
      const resultDiv = document.getElementById('delete-result');
      const id = document.getElementById('delete-id').value;
      
      if (!id) {
        resultDiv.innerHTML = `<p class="error">✗ Please enter a prestasi ID</p>`;
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/prestasi/${id}`, {
          method: 'DELETE'
        });

        const result = await response.json();
        
        if (response.ok) {
          resultDiv.innerHTML = `<p class="success">✓ Deleted prestasi ID: ${id}</p>`;
          resultDiv.innerHTML += `<p>${result.message}</p>`;
          log(`✓ deletePrestasi: Success, ID=${id}`);
        } else {
          resultDiv.innerHTML = `<p class="error">✗ Error: ${result.error}</p>`;
          log(`✗ deletePrestasi failed: ${result.error}`, true);
        }
      } catch (error) {
        resultDiv.innerHTML = `<p class="error">✗ Error: ${error.message}</p>`;
        log(`✗ deletePrestasi failed: ${error.message}`, true);
      }
    }

    // Auto-run load test on page load
    window.addEventListener('load', () => {
      log('=== Prestasi Frontend Test Started ===');
      testLoadPrestasi();
    });
  </script>
</body>
</html>
